<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>E Harre — Informatika Test</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:linear-gradient(135deg,#111827,#2563eb);min-height:100vh;color:#111827;display:flex;align-items:center;justify-content:center;padding:20px}
.card{width:min(760px,100%);background:#fff;border-radius:24px;padding:30px;box-shadow:0 20px 60px #0006}
h1{text-align:center;color:#2563eb;margin-top:0}.sub{text-align:center;color:#6b7280}
.levels{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;margin-top:25px}
.level{border:0;border-radius:16px;padding:20px;cursor:pointer;color:white;font-size:18px;font-weight:bold}.level small{display:block;margin-top:7px;font-size:13px;opacity:.9}
.l1{background:#16a34a}.l2{background:#ca8a04}.l3{background:#ea580c}.l4{background:#dc2626}.l5{background:#7c3aed}
.top{display:flex;justify-content:space-between;font-weight:bold;margin-bottom:15px}.progress{height:9px;background:#e5e7eb;border-radius:10px;overflow:hidden}.bar{height:100%;background:#2563eb;width:5%}
.question{font-size:22px;font-weight:bold;margin:25px 0}.option{display:block;width:100%;padding:15px;margin:10px 0;border:2px solid #d1d5db;border-radius:12px;background:#f9fafb;text-align:left;font-size:16px;cursor:pointer}.option:hover,.option.selected{background:#dbeafe;border-color:#2563eb}
.btn{width:100%;padding:15px;border:0;border-radius:12px;background:#2563eb;color:white;font-size:17px;font-weight:bold;cursor:pointer;margin-top:15px}.hidden{display:none}.result{text-align:center}.score{font-size:44px;color:#2563eb;font-weight:bold}
</style>
</head>
<body>
<div class="card">
<div id="home">
<h1>🧠 E Harre</h1><p class="sub">Informatika testi — darajani tanlang</p>
<div class="levels">
<button class="level l1" onclick="start(1)">1-DARAJA<small>🟢 Oson</small></button>
<button class="level l2" onclick="start(2)">2-DARAJA<small>🟡 Yengil</small></button>
<button class="level l3" onclick="start(3)">3-DARAJA<small>🟠 O‘rtacha</small></button>
<button class="level l4" onclick="start(4)">4-DARAJA<small>🔴 Qiyin</small></button>
<button class="level l5" onclick="start(5)">5-DARAJA<small>🟣 Juda qiyin</small></button>
</div>
</div>

<div id="quiz" class="hidden">
<div class="top"><span id="count"></span><span id="timer">10:00</span></div>
<div class="progress"><div class="bar" id="bar"></div></div>
<div class="question" id="question"></div><div id="options"></div>
<button class="btn" onclick="next()">Keyingi savol →</button>
</div>

<div id="result" class="hidden result">
<h1>🎉 Natija</h1><div class="score" id="score"></div><p id="msg"></p>
<button class="btn" onclick="location.reload()">Darajalarni ko‘rish</button>
</div>
</div>

let quiz=[],i=0,correct=0,selected=null,time=600,timer;
function start(level){
 quiz=[...data[level]].sort(()=>Math.random()-0.5);i=0;correct=0;time=600;
 document.getElementById("home").classList.add("hidden");document.getElementById("quiz").classList.remove("hidden");
 clearInterval(timer);timer=setInterval(()=>{time--;showTime();if(time<=0)finish()},1000);show();
}
function showTime(){document.getElementById("timer").textContent=Math.floor(time/60)+":"+String(time%60).padStart(2,"0")}
function show(){
 selected=null;let q=quiz[i];document.getElementById("count").textContent=`Savol ${i+1} / 20`;
 document.getElementById("bar").style.width=((i+1)*5)+"%";document.getElementById("question").textContent=q[0];
 let box=document.getElementById("options");box.innerHTML="";
 q[1].forEach((x,n)=>{let b=document.createElement("button");b.className="option";b.textContent=String.fromCharCode(65+n)+") "+x;b.onclick=()=>{selected=n;document.querySelectorAll(".option").forEach(z=>z.classList.remove("selected"));b.classList.add("selected")};box.appendChild(b)})
}
function next(){if(selected===null){alert("Javobni tanlang!");return}if(selected===quiz[i][2])correct++;i++;if(i>=20)finish();else show()}
function finish(){clearInterval(timer);document.getElementById("quiz").classList.add("hidden");document.getElementById("result").classList.remove("hidden");document.getElementById("score").textContent=correct+" / 20";document.getElementById("msg").textContent=correct>=18?"🏆 Ajoyib!":correct>=14?"👏 Juda yaxshi!":correct>=10?"💪 Yaxshi!":"📚 Yana mashq qiling!"}
</script>
